<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фиона Моран | Fantasy Roulette</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #1a0822;
            --pink-main: #ff477e;
            --pink-glow: rgba(255, 71, 126, 0.6);
            --blue-main: #00f0ff;
            --blue-glow: rgba(0, 240, 255, 0.5);
            --text-white: #ffffff;
            --text-gray: #bbaec6;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.15);
            
            --font-main: 'Outfit', sans-serif;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none; /* Запрет выделения текста при свайпах */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-white);
            overflow: hidden; /* Запрет стандартного скролла, интерфейс как приложение */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            
            /* Сложный фон: сетка и радиальные градиенты из референса */
            background-image: 
                radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 71, 126, 0.15) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            background-position: center bottom;
        }

        /* --- ВЕРХНЕЕ МЕНЮ --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            z-index: 100;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid var(--blue-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--blue-main);
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            background: rgba(0, 240, 255, 0.05);
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: var(--transition);
        }
        .nav-link:hover { color: var(--pink-main); text-shadow: 0 0 10px var(--pink-glow); }

        .btn-outline {
            border: 1px solid var(--pink-main);
            padding: 8px 24px;
            border-radius: 30px;
            color: var(--text-white);
            text-decoration: none;
            font-weight: 500;
            background: rgba(255, 71, 126, 0.05);
            transition: var(--transition);
        }
        .btn-outline:hover { background: var(--pink-main); box-shadow: 0 0 15px var(--pink-glow); }

        .burger {
            width: 35px;
            height: 35px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .burger span { display: block; width: 18px; height: 2px; background: white; }

        /* --- ОСНОВНОЙ КОНТЕЙНЕР (Слева текст, Справа рулетка) --- */
        .main-layout {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 50px;
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- ЛЕВЫЙ ТЕКСТОВОЙ БЛОК --- */
        .text-panel {
            flex: 0 0 450px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.3s ease;
        }

        .title-primary {
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .title-gradient {
            font-size: clamp(2.5rem, 4vw, 3.8rem);
            font-weight: 800;
            line-height: 1.1;
            color: var(--pink-main);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .title-icon {
            width: 35px;
            height: 35px;
            background: var(--text-white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-base);
            font-size: 1.2rem;
        }

        .description {
            color: var(--text-gray);
            font-size: 1rem;
            line-height: 1.7;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* Кнопка с круглым фоном для стрелки */
        .btn-review {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            padding: 6px 6px 6px 24px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            align-self: flex-start;
            background: linear-gradient(90deg, rgba(255,255,255,0.05), transparent);
            transition: var(--transition);
        }
        .btn-review:hover { border-color: var(--pink-main); box-shadow: 0 0 20px var(--pink-glow); }
        .btn-review .circle-arrow {
            width: 35px;
            height: 35px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-base);
            font-weight: 800;
        }

        /* --- КАРУСЕЛЬ-РУЛЕТКА (Правая часть) --- */
        .carousel-area {
            flex: 1;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
        }

        .cards-container {
            position: relative;
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            cursor: grab;
        }
        .cards-container:active { cursor: grabbing; }

        /* Дизайн карточки */
        .card {
            position: absolute;
            width: 280px;
            height: 400px;
            border-radius: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--glass-border);
            overflow: hidden;
            transition: transform 0.1s linear, opacity 0.1s linear, filter 0.1s linear;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.05);
            /* Отключаем pointer-events для неактивных карточек в JS */
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none; /* Чтобы не мешало drag-событиям */
        }

        /* Иконки поверх карточки (как на референсе) */
        .icon-play {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pink-main);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 1.2rem;
            padding-left: 3px;
        }
        .icon-download {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .card.active-card .icon-play,
        .card.active-card .icon-download {
            opacity: 1;
        }
        .card.active-card {
            border-color: rgba(255, 71, 126, 0.4);
            box-shadow: 0 20px 50px var(--pink-glow);
        }

        /* Кнопка под каруселью */
        .view-all-wrapper {
            position: absolute;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 50;
        }
        .btn-view-all {
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            padding: 10px 30px;
            color: white;
            background: rgba(255,255,255,0.05);
            text-decoration: none;
            backdrop-filter: blur(5px);
            transition: var(--transition);
        }
        .btn-view-all:hover { background: rgba(255,255,255,0.1); border-color: white; }
        
        .arrow-down-circle {
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-base);
            font-size: 0.8rem;
        }

        /* Светящаяся орбита/кольцо внизу (как планета на картинке) */
        .glowing-orbit {
            position: absolute;
            bottom: -350px;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 500px;
            border-radius: 50%;
            border-top: 3px solid var(--blue-main);
            box-shadow: 0 -20px 100px var(--blue-glow);
            z-index: 0;
            pointer-events: none;
        }

        /* --- МОДАЛЬНОЕ ОКНО ДЛЯ ЧТЕНИЯ/ПРОСМОТРА --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 2, 15, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: linear-gradient(145deg, #2d1240, #1c0a2b);
            border: 1px solid var(--pink-main);
            box-shadow: 0 0 50px var(--pink-glow);
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            position: relative;
            transform: scale(0.9);
            transition: var(--transition);
            text-align: center;
        }
        .modal.active .modal-content { transform: scale(1); }
        
        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close:hover { background: var(--pink-main); }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .modal-btn {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-fill { background: var(--pink-main); color: white; box-shadow: 0 0 15px var(--pink-glow); }
        .btn-fill:hover { background: white; color: var(--pink-main); }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; justify-content: flex-start; padding: 20px; padding-top: 40px; }
            .text-panel { flex: none; text-align: center; align-items: center; margin-bottom: 20px; }
            .btn-review { align-self: center; }
            .carousel-area { flex: none; width: 100%; height: 450px; }
            .glowing-orbit { bottom: -400px; width: 800px; }
            .card { width: 220px; height: 320px; }
        }

        @media (max-width: 768px) {
            .header { padding: 20px; }
            .nav-links { display: none; }
            .title-primary { font-size: 2.2rem; }
            .title-gradient { font-size: 1.8rem; }
            .card { width: 180px; height: 260px; }
            .view-all-wrapper { bottom: 20px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">FM</div>
        <nav class="nav-links">
            <a href="#" class="nav-link">Книги</a>
            <a href="#" class="nav-link">Иллюстрации</a>
            <a href="#" class="nav-link">Соцсети</a>
            <a href="#" class="btn-outline">Читать</a>
        </nav>
        <div class="burger">
            <span></span><span></span><span></span>
        </div>
    </header>

    <main class="main-layout">
        
        <div class="text-panel" id="textPanel">
            <h2 class="title-primary" id="ui-type">Fantasy Picture</h2>
            <h1 class="title-gradient" id="ui-logline">Background <div class="title-icon">↓</div></h1>
            <p class="description" id="ui-desc">Fantasi bisa juga merupakan sebuah genre fiksi, yang menggunakan bentuk sihir dan supranatural sebagai salah satu unsur alur, tema, dan layar dalam sebuah film.</p>
            
            <a href="#" class="btn-review" id="ui-btn" onclick="openActiveItemModal(event)">
                Review <div class="circle-arrow">→</div>
            </a>
        </div>

        <div class="carousel-area">
            <div class="cards-container" id="sliderTrack">
                </div>
            
            <div class="view-all-wrapper">
                <a href="#" class="btn-view-all">View All</a>
                <div class="arrow-down-circle">↓</div>
            </div>

            <div class="glowing-orbit"></div>
        </div>

    </main>

    <div class="modal" id="actionModal" onclick="closeModal(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModalDirect()">×</button>
            <h2 id="modalTitle" style="font-size: 2rem; margin-bottom: 15px; color: var(--pink-main);">Название</h2>
            <p id="modalDesc" style="color: var(--text-gray); line-height: 1.6;">Аннотация...</p>
            <div class="modal-buttons" id="modalLinks">
                </div>
        </div>
    </div>

    <script>
        // База данных карточек (Книги + Иллюстрации)
        const portfolioItems = [
            {
                id: 1,
                type: 'Цветы для ведьмы',
                logline: 'ЛЯЛЯЛЯ1',
                desc: 'Изнурённые голодом и страхом жители отправляют юношу в сердце леса, чтобы умилостивить таинственную ведьму и вернуть плодородие полям. История о том, как страх превращается в силу, одиночество — в понимание, а жертва — в смысл.',
                img: 'witch-cover.jpg',
                links: `
                    <a href="https://author.today/work/480263" target="_blank" class="modal-btn btn-fill">Автор.Тудей</a>
                    <a href="https://litnet.com/ru/book/cvety-dlya-vedmy-b601104" target="_blank" class="modal-btn btn-fill" style="background: transparent; border: 1px solid var(--blue-main); color: var(--blue-main); box-shadow: none;">Литнет</a>
                `
            },
            {
                id: 2,
                type: 'Петля',
                logline: 'ЛЯЛЯЛЯ2',
                desc: 'Она согласилась на месяц службы в замке Лихтенштайн, о котором ходят слухи. Говорят, там не осталось ни одной живой души. Говорят, из этих стен не возвращаются. Ей нужно спасти сестру... но что, если замок ждал именно её?',
                img: 'loop-cover.jpg',
                links: `<a href="https://litnet.com/ru/book/petlya-b612274" target="_blank" class="modal-btn btn-fill">Читать на Литнет</a>`
            },
            // Добавляем 10 слотов под иллюстрации
            ...Array.from({length: 10}, (_, i) => ({
                id: i + 3,
                type: `Иллюстрация ${i + 1}`,
                logline: `ART_${i + 1}`,
                desc: 'Атмосферная цифровая иллюстрация, раскрывающая фрагмент темного и завораживающего фэнтези-мира.',
                img: `art_${i + 1}.jpg`,
                links: `<a href="#" class="modal-btn btn-fill" onclick="closeModalDirect(); return false;">Закрыть галерею</a>`
            }))
        ];

        // --- Инициализация DOM-элементов ---
        const track = document.getElementById('sliderTrack');
        const textPanel = document.getElementById('textPanel');
        const uiType = document.getElementById('ui-type');
        const uiLogline = document.getElementById('ui-logline');
        const uiDesc = document.getElementById('ui-desc');

        // Создаем HTML-карточки
        portfolioItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            // Добавляем иконки как на референсе (сверху справа Play, по центру Download)
            card.innerHTML = `
                <img src="${item.img}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop'">
                <div class="icon-play">▶</div>
                <div class="icon-download">↓</div>
            `;
            // Обработчик клика по карточке (если она в центре — открываем окно)
            card.addEventListener('click', () => {
                if (Math.round(currentPos) === index) {
                    openActiveItemModal(new Event('click'));
                } else {
                    // Если кликнули на боковую — скроллим рулетку к ней
                    targetPos = index;
                }
            });
            track.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');
        const maxIndex = cards.length - 1;

        // --- ФИЗИКА ДВИЖКА ПРОКРУТКИ (Coverflow / Рулетка) ---
        let currentPos = 0; // Текущая плавающая позиция (например, 1.45)
        let targetPos = 0;  // Целевой индекс, к которому стремимся
        let isDragging = false;
        let startX = 0;
        let startPos = 0;
        let lastActiveIndex = -1;

        // Расстояние между карточками при свайпе
        const dragSensitivity = window.innerWidth < 768 ? 150 : 250; 

        // Обработчики мыши и касаний
        track.addEventListener('mousedown', dragStart);
        track.addEventListener('touchstart', dragStart, {passive: true});
        
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('touchmove', dragMove, {passive: false});
        
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            startPos = currentPos;
            track.style.cursor = 'grabbing';
        }

        function dragMove(e) {
            if (!isDragging) return;
            // Для touch-событий предотвращаем скролл страницы по умолчанию, если тянем вбок
            if (e.type.includes('touch')) e.preventDefault();
            
            const currentX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            const deltaX = startX - currentX;
            
            // Смещаем целевую позицию пропорционально сдвигу курсора
            targetPos = startPos + (deltaX / dragSensitivity);
            
            // Ограничиваем скролл пределами массива
            if (targetPos < 0) targetPos = 0;
            if (targetPos > maxIndex) targetPos = maxIndex;
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            track.style.cursor = 'grab';
            // Округляем до ближайшей целой карточки, чтобы она "примагнитилась" по центру
            targetPos = Math.round(targetPos);
        }

        // Цикл рендеринга (60 FPS)
        function animateLoop() {
            // Плавное интерполирование позиции (пружинный эффект)
            currentPos += (targetPos - currentPos) * 0.1;
            
            // Определяем, какая карточка сейчас ближе всего к центру
            const activeIndex = Math.round(currentPos);
            
            // Если активная карточка сменилась — обновляем текст слева
            if (activeIndex !== lastActiveIndex) {
                updateUIText(activeIndex);
                lastActiveIndex = activeIndex;
            }

            cards.forEach((card, index) => {
                // Вычисляем смещение каждой карточки относительно центральной точки
                const offset = index - currentPos;
                const absOffset = Math.abs(offset);
                
                // Настройки геометрии рулетки
                const translateX = offset * 220; // Шаг по горизонтали
                const translateY = absOffset * 40; // Прогиб вниз (дуга)
                const scale = Math.max(0.5, 1 - absOffset * 0.2); // Уменьшение боковых
                const zIndex = 100 - Math.round(absOffset); // Центральная всегда сверху
                
                // Для эффекта фокуса (blur/opacity)
                const isCenter = Math.round(currentPos) === index;
                const opacity = Math.max(0, 1 - absOffset * 0.5);
                const blur = isCenter ? 'blur(0px)' : `blur(${absOffset * 3}px)`;

                card.style.transform = `translate(-50%, -50%) translate(${translateX}px, ${translateY}px) scale(${scale})`;
                card.style.zIndex = zIndex;
                card.style.opacity = opacity;
                card.style.filter = blur;
                
                // Переключатель активного класса для иконок
                if (isCenter) {
                    card.classList.add('active-card');
                    card.style.pointerEvents = 'auto'; // Разрешаем клик по центральной
                } else {
                    card.classList.remove('active-card');
                    card.style.pointerEvents = 'none'; // Боковые не перехватывают драг
                }
            });

            requestAnimationFrame(animateLoop);
        }

        // Запуск анимационного цикла
        animateLoop();

        // --- ЛОГИКА ОБНОВЛЕНИЯ ТЕКСТА ---
        function updateUIText(index) {
            const item = portfolioItems[index];
            if (!item) return;

            // Эффект затухания перед сменой текста
            textPanel.style.opacity = 0;
            
            setTimeout(() => {
                uiType.textContent = item.type;
                uiLogline.innerHTML = `${item.logline} <div class="title-icon">↓</div>`;
                uiDesc.textContent = item.desc;
                textPanel.style.opacity = 1;
            }, 200); // 200ms на CSS transition
        }

        // --- ЛОГИКА МОДАЛЬНОГО ОКНА ---
        const actionModal = document.getElementById('actionModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalLinks = document.getElementById('modalLinks');

        function openActiveItemModal(e) {
            e.preventDefault();
            const activeItem = portfolioItems[lastActiveIndex];
            
            modalTitle.textContent = activeItem.type;
            modalDesc.textContent = activeItem.desc;
            modalLinks.innerHTML = activeItem.links;
            
            actionModal.classList.add('active');
        }

        function closeModalDirect() {
            actionModal.classList.remove('active');
        }

        function closeModal(e) {
            if (e.target === actionModal) closeModalDirect();
        }

        // Поддержка скролла колесиком мыши (доп. удобство)
        track.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0) {
                targetPos = Math.min(maxIndex, targetPos + 1);
            } else {
                targetPos = Math.max(0, targetPos - 1);
            }
        }, {passive: false});

    </script>
</body>
</html>
